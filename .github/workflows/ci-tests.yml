name: CI - Tests de integracion

on:
  push:
    branches:
      - v_docker_prod
  pull_request:
    branches:
      - v_docker_prod

jobs:
  integration-tests:
    name: Pytest integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: |
          pip install --upgrade pip
          pip install httpx pytest

      - name: Verificar variables requeridas
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          missing=()
          [ -z "$BASE_URL" ]      && missing+=("BASE_URL (repository variable)")
          [ -z "$TEST_EMAIL" ]    && missing+=("TEST_EMAIL (repository variable)")
          [ -z "$TEST_PASSWORD" ] && missing+=("TEST_PASSWORD (repository secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Las siguientes variables no están configuradas en GitHub:"
            for v in "${missing[@]}"; do echo "  - $v"; done
            echo ""
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Variables OK — BASE_URL=$BASE_URL  TEST_EMAIL=$TEST_EMAIL"

      - name: Correr tests de integración
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          pytest tests/test_integration_v1.py -v --tb=short
