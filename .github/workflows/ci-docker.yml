name: CI - Docker build

on:
  push:
    branches:
      - v_docker_prod
  pull_request:
    branches:
      - v_docker_prod

jobs:
  docker-build:
    name: Verificar Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build de imagen Docker
        run: |
          docker build -t organizat-api:ci-check .
